[[permission]]
identifier = "allow-open-external-url"
description = "Allows Eureka's local WebView to request opening an HTTP or HTTPS link in the system browser."
commands.allow = ["open_external_url"]

[[permission]]
identifier = "allow-desktop-clipboard-files"
description = "Allows the composer to read copied file paths when the user pastes."
commands.allow = ["desktop_clipboard_files"]

[[permission]]
identifier = "allow-desktop-select-attachments"
description = "Allows the composer to open the system picker at the current project directory."
commands.allow = ["desktop_select_attachments"]

[[permission]]
identifier = "allow-desktop-select-directory"
description = "Allows the project selector to open the system folder picker at the current directory."
commands.allow = ["desktop_select_directory"]

[[permission]]
identifier = "allow-desktop-window-action"
description = "Allows the isolated local titlebar to control its own desktop window."
commands.allow = ["desktop_window_action"]

[[permission]]
identifier = "allow-set-desktop-theme"
description = "Allows the Eureka frontend to synchronize the persistent desktop titlebar theme."
commands.allow = ["set_desktop_theme"]

[[permission]]
identifier = "allow-set-desktop-navigation-state"
description = "Allows the Eureka content view to synchronize titlebar navigation availability."
commands.allow = ["set_desktop_navigation_state"]

[[permission]]
identifier = "allow-desktop-menu-titlebar"
description = "Allows the local titlebar to open app menus and dispatch predefined keyboard actions."
commands.allow = ["desktop_open_menu", "desktop_dispatch_menu_action"]

[[permission]]
identifier = "allow-desktop-menu-content"
description = "Allows the content view to synchronize menus and recent tray sessions, change view scale/fullscreen, and quit the app."
commands.allow = ["set_desktop_menu_state", "desktop_close_menu", "desktop_cycle_menu", "desktop_view_action", "set_desktop_tray_state"]

[[permission]]
identifier = "allow-desktop-tray-popup"
description = "Allows only the packaged tray popup to read its menu and perform predefined tray actions."
commands.allow = ["desktop_tray_snapshot", "desktop_tray_action"]
