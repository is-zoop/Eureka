<!doctype html>
<html lang="zh-CN">

    <title>Eureka 无法启动</title>
    <style>
      body { background: #111827; color: #f9fafb; font: 16px system-ui, sans-serif; margin: 0; display: grid; min-height: 100vh; place-items: center; }
      main { max-width: 34rem; padding: 2rem; } h1 { margin-top: 0; } p { color: #d1d5db; line-height: 1.6; }
      code { background: #1f2937; padding: .15rem .35rem; border-radius: .25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Eureka 服务未能启动</h1>
      <p>请关闭 Eureka 后重试。如果问题持续存在，请查看应用数据目录中的 <code>logs/eureka.log</code>。</p>
      <p>此应用会继续兼容您现有的 Pi 会话与配置；错误不会修改这些数据。</p>
