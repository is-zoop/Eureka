<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Eureka</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f6f6;
        --text: #30302e;
        --muted: #74746e;
        --halo: rgba(48, 48, 46, .045);
        --track: rgba(48, 48, 46, .08);
        --indicator: rgba(48, 48, 46, .45);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--text);
        font: 14px "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px;
        text-align: center;
        animation: appear 650ms cubic-bezier(.2, .7, .3, 1) both;
      }

      .brand-icon {
        position: relative;
        display: grid;
        place-items: center;
        width: 144px;
        height: 144px;
        margin-bottom: 24px;
      }

      .brand-icon::before {
        content: "";
        position: absolute;
        inset: -24px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--halo), transparent 70%);
        animation: breathe 3.6s ease-in-out infinite;
      }

      .brand-icon img {
        position: relative;
        width: 120px;
        height: 120px;
        object-fit: contain;
        animation: float 3.6s ease-in-out infinite;
      }

      .logo-dark { display: none; }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -.8px;
      }

      .status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        margin-top: 16px;
      }

      p { margin: 0; color: var(--muted); line-height: 1.5; }

      .loading-track {
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
      }

      .loading-track::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--indicator), transparent);
        animation: loading 1.6s ease-in-out infinite;
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes breathe {
        0%, 100% { opacity: .6; transform: scale(.92); }
        50% { opacity: 1; transform: scale(1.08); }
      }

      @keyframes loading {
        from { transform: translateX(-100%); }
        to { transform: translateX(350%); }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1a1a1a;
          --text: #e8e8e8;
          --muted: #9ca3af;
          --halo: rgba(232, 232, 232, .06);
          --track: rgba(232, 232, 232, .1);
          --indicator: rgba(232, 232, 232, .55);
        }
        .logo-light { display: none; }
        .brand-icon .logo-dark { display: block; }
      }

      @media (prefers-reduced-motion: reduce) {
        main, .brand-icon::before, .brand-icon img, .loading-track::after {
          animation: none;
        }
        .loading-track::after { margin-inline: auto; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="app-name">
      <div class="brand-icon" aria-hidden="true">
        <img class="logo-light" src="logo-black.png" width="120" height="120" alt="" draggable="false" />
        <img class="logo-dark" src="logo-white.png" width="120" height="120" alt="" draggable="false" />
      </div>
      <h1 id="app-name">Eureka</h1>
      <div class="status" role="status" aria-live="polite">
        <p>正在启动…</p>
        <div class="loading-track" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
