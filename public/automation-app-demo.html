<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>A04 通用网页验收（模拟）</title>
<style>body{font:15px system-ui;margin:28px;color:#222}header,section{padding:18px;border:1px solid #ddd;border-radius:10px;margin:16px 0}input,button,select{font:inherit;padding:7px;margin:5px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}small{color:#666}.notice{background:#fff8df;padding:12px}</style>
<h1>A04 通用网页验收</h1><p class="notice">全部是本机模拟数据，与真实淘宝、店铺、营销和业务操作无关。只用于人工验收通用能力。</p>
<header>当前账号：<strong id="account"></strong><label>切换模拟账号<select id="account-choice"><option value="演示账号 A">演示账号 A</option><option value="演示账号 B">演示账号 B</option><option value="">退出模拟登录</option></select></label><small>修改后立即生效，用于核对账号变化时重新授权。</small></header>
<section id="queries"><h2 id="heading"></h2><label>查询标识<input id="query" aria-label="查询标识" placeholder="DEMO-001 或 DEMO-002"></label><button id="search">查询</button><p id="query-state">尚未查询</p><table><thead id="columns"></thead><tbody id="rows"></tbody></table></section>
<section id="operations"><h2>模拟网页变更</h2><p>此设置保存在本机页面的模拟账号下，不改变真实业务。</p><label><input type="checkbox" id="enabled">启用演示选项</label><p id="write-state"></p><p><label><input type="checkbox" id="block-proof">模拟变更后页面校验不可用（手动勾选后再运行，用于验收未知结果停止）</label></p></section>
<script>
const view=new URLSearchParams(location.search).get('view')||'products';
const account=document.querySelector('#account'), choice=document.querySelector('#account-choice'), enabled=document.querySelector('#enabled');
const stateKey=()=> 'eureka-a04-setting:'+account.innerText;
function showAccount(){account.innerText=localStorage.getItem('eureka-a04-account')??'演示账号 A';choice.value=account.innerText;enabled.checked=localStorage.getItem(stateKey())==='true';document.querySelector('#write-state').innerText=enabled.checked?'已启用':'未启用';}
choice.onchange=()=>{localStorage.setItem('eureka-a04-account',choice.value);showAccount();};showAccount();
document.querySelector('#queries').hidden=view==='operations';document.querySelector('#operations').hidden=view!=='operations';
document.querySelector('#heading').innerText=view==='marketing'?'营销字段查询（模拟）':'商品字段查询（模拟）';
const product=[{id:'DEMO-001',title:'模拟商品一',price:'￥659.00',stock:'0',sales:'1,446'},{id:'DEMO-002',title:'模拟商品二',price:'￥839.00',stock:'12',sales:'839'}];
const marketing=[{id:'DEMO-001',title:'模拟活动一',campaignId:'10030087793610',fee:'10%',date:'2026-10-27',tags:'["示例","秋季"]',extra:'{"channel":"演示"}',optional:''},{id:'DEMO-002',title:'模拟活动二',campaignId:'10030087793611',fee:'0%',date:'2026-10-28',tags:'[]',extra:'{"channel":"演示"}',optional:''}];
const fields=view==='marketing'?['id','title','campaignId','fee','date','tags','extra','optional']:['id','title','price','stock','sales'];
const head=document.createElement('tr');for(const f of fields){const th=document.createElement('th');th.textContent=f;head.append(th);}document.querySelector('#columns').append(head);
document.querySelector('#search').onclick=()=>{const query=document.querySelector('#query').value.trim(), ids=query.split(/[,，\s]+/), data=(view==='marketing'?marketing:product).filter(row=>ids.includes(row.id));const rows=document.querySelector('#rows');rows.replaceChildren();for(const item of data){const row=document.createElement('tr');for(const f of fields){const cell=document.createElement('td');cell.dataset.field=f;cell.textContent=item[f];row.append(cell);}rows.append(row);}document.querySelector('#query-state').innerText='完成：'+query;};
const blockProof=document.querySelector('#block-proof');blockProof.checked=localStorage.getItem('eureka-a04-block-proof')==='true';blockProof.onchange=()=>localStorage.setItem('eureka-a04-block-proof',String(blockProof.checked));
enabled.onchange=()=>{localStorage.setItem(stateKey(),String(enabled.checked));document.querySelector('#write-state').innerText=enabled.checked?'已启用':'未启用';if(blockProof.checked)enabled.id='unavailable-after-write';};
</script></html>
